# RLS access matrix (F11, #21). Compiled to matrix.test.sql by `pnpm db:compile-tests`.
#
# Every table in an exposed schema (api, app, public) needs an entry, or CI fails.
# For each operation, list the actors that are ALLOWED; every other actor must be denied.
#
# Actors (created by tests.create_world()):
#   anon            no session (guests; a guest token grants no table access)
#   owner, admin, manager, staff   members of org A
#   display, kiosk  paired devices of org A's location
#   other_owner     owner of org B. Can only be listed on global_tables: cross-tenant access is always denied.
#
# Per table:
#   where:   SQL predicate selecting one org A fixture row (probed by select/update/delete)
#   update:  SET clause that leaves the row unchanged, e.g. "name = name"
#   insert:  column list + VALUES for a new org A row, e.g. "(org_id, name) values (tests.id('org_a'), 'x')"
#   allow:   { select: [...], insert: [...], update: [...], delete: [...] }

# Tables in app that are deliberately not tenant-scoped (no org_id). Give a reason for each.
global_tables:
  - app.dial_codes # calling codes, the same for every tenant
  - app.organizations # the tenant root: its id is the org_id
  - app.visit_transitions # the state machine, identical for every tenant
  - app.entitlement_defaults # deployment-wide limits and flag defaults, the same for every tenant
  - app.platform_flags # deployment gate flags, written only by the deploy runbook as service_role
  - app.consent_texts # published opt-in copy, identical for every tenant and append-only
  - app.sms_footers # opt-out wording per locale, identical for every tenant and written only by migrations
  - app.sms_guard_terms # the SMS blocklist, identical for every tenant and written only by migrations
  - app.template_catalog # setup templates, identical for every tenant, versions immutable and written only by migrations

