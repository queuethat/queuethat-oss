# F4 (#14). Commit prefixes keep Dependabot PR titles valid for the semantic-title check
# ("build(deps): bump ...", "ci(deps): bump ...").
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    cooldown: { default-days: 7 }
    commit-message: { prefix: build, include: scope }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # TypeScript waits for typescript-eslint; ESLint waits for jsx-a11y (see PR #398).
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@eslint/js'
        update-types: [version-update:semver-major]
      # Held at 1.63.0. The WebKit build that ships with 1.64 reports a style-src-attr violation
      # of the report-only CSP for every <select> the page creates (raised at React's
      # document.createElement('select'); no code of ours sets an inline style), which fails
      # csp.spec.ts on the iPhone project. Lift this once a later WebKit build passes that spec.
      - dependency-name: '@playwright/test'

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    commit-message: { prefix: ci, include: scope }
    groups:
      actions:
        patterns: ['*']

  # Self-host stack (2P-OPS1, #207): bumps the tag and digest of every pinned image. The
  # selfhost-smoke job (#213) boots the result before anything merges.
  - package-ecosystem: docker-compose
    directory: /deploy/selfhost
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build, include: scope }
