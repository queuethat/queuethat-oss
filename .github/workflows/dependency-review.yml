# F4 (#14): fails a PR that adds a dependency whose licence is outside
# .github/license-policy.json. Separate from pr-checks.yml so title and label edits don't
# reinstall dependencies; a job skipped on those events would also count as a passing check.
name: Dependency review

on:
  pull_request:

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: npm licences against .github/license-policy.json
        run: node .github/scripts/license-check.mjs
      # GitHub's action also covers actions and Docker, and vulnerabilities, but needs a public
      # repo or GitHub Advanced Security. It reads the same allowlist.
      - id: policy
        if: ${{ !github.event.repository.private }}
        run: echo "allow=$(node -p "require('./.github/license-policy.json').allow.join(',')")" >> "$GITHUB_OUTPUT"
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: ${{ !github.event.repository.private }}
        with:
          fail-on-severity: high
          allow-licenses: ${{ steps.policy.outputs.allow }}
