# O7 (#78): weekly restore drill. Restores the newest backup into a throwaway local Supabase
# stack on the runner and runs the smoke checks in scripts/restore-drill.sh. A backup that has
# never been restored is a rumour. Setup: docs/ops/backups.md.
name: Restore drill

on:
  schedule:
    - cron: '45 4 * * 1' # Mondays 04:45 UTC, after that night's backup
  workflow_dispatch:
    inputs:
      stamp:
        description: Backup to restore (e.g. 2026-10-29T031500Z). Empty restores the newest.
        required: false

concurrency:
  group: restore-drill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drill:
    # The hosted service's own backup: needs its secrets, so it never runs in a fork.
    if: github.repository == 'queuethat/queuethat-internal'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install age
        run: sudo apt-get update -q && sudo apt-get install -yq age
      - name: Start trimmed Supabase stack
        run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,storage-api,edge-runtime,supavisor,mailpit
      - name: Restore the backup and run the smoke checks
        env:
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_READ_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_READ_SECRET }}
          AWS_DEFAULT_REGION: auto
          BACKUP_STAMP: ${{ inputs.stamp }}
          # Real backups have no demo accounts, so the Playwright smoke spec can't sign in.
          DRILL_E2E: '0'
        run: bash scripts/restore-drill.sh
      - name: Heartbeat
        if: always()
        env:
          URL: ${{ secrets.RESTORE_DRILL_HEALTHCHECK_URL }}
          OUTCOME: ${{ job.status }}
        run: |
          [ -n "$URL" ] || exit 0
          if [ "$OUTCOME" = success ]; then curl -fsS -m 10 --retry 3 -o /dev/null "$URL"
          else curl -fsS -m 10 --retry 3 -o /dev/null "$URL/fail"; fi
