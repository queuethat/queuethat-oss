# O7 (#78): nightly encrypted backup of the pilot database to Cloudflare R2. The dump is
# age-encrypted as it streams, so nothing unencrypted is written to the runner or uploaded.
# Setup and restore steps: docs/ops/backups.md.
name: Backup

on:
  schedule:
    - cron: '15 3 * * *' # 03:15 UTC, after the 00:15 platform-stats rollup
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    # The hosted service's own backup: needs its secrets, so it never runs in a fork.
    if: github.repository == 'queuethat/queuethat-internal'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install age
        run: sudo apt-get update -q && sudo apt-get install -yq age
      - name: Dump, encrypt, upload, keep 14
        env:
          BACKUP_DB_URL: ${{ secrets.BACKUP_DB_URL }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_WRITE_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_WRITE_SECRET }}
          AWS_DEFAULT_REGION: auto
          BACKUP_HEALTHCHECK_URL: ${{ secrets.BACKUP_HEALTHCHECK_URL }}
        run: bash scripts/backup.sh
