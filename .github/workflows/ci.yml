# F3 (#13): the checks for every PR. Branch protection should require only `ci-ok`, which
# always reports, so path-skipped jobs never block a merge.
#
# Browser tests are tiered so a pull request gets its answer quickly:
#   pull request   the core journeys (tests tagged @core) on desktop Chrome, in one job;
#                  none at all when the change cannot reach the app (docs and the like)
#   push to main   the whole suite on desktop Chrome and iPhone, four shards
#   nightly        the whole suite on every device project
# A regression outside the core journeys therefore shows up as a red run on main after the
# merge, not on the pull request.
name: CI

on:
  pull_request:
  push:
    branches: [main, development]
  workflow_dispatch:
  schedule:
    # F10 (#20): nightly run of the full e2e device matrix.
    - cron: '0 7 * * *'

concurrency:
  # Only a pull request's superseded run is cancelled. Each push to main keeps its own run, so
  # the full browser suite reports for every merge even when two land close together.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION_FILE: .nvmrc

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      db: ${{ steps.filter.outputs.db }}
      compliance: ${{ steps.filter.outputs.compliance }}
      app: ${{ steps.app.outputs.app }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Only pull requests are filtered: every other event runs everything, whatever changed.
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            db:
              - 'supabase/**'
              - 'packages/db-types/**'
              - 'tests/concurrency/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            compliance:
              - 'supabase/**'
              - 'tests/compliance/**'
              - 'tests/fixtures/webhooks/**'
              - 'docs/compliance/**'
              - 'docs/compliance/security-review.md'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
      # True when at least one changed file is none of the kinds below, which is to say it
      # could change what the browser tests see. A file has to match every pattern to count,
      # hence the separate step: `every` would turn the lists above into "all of".
      # Anything not listed here runs the browser tests, so a new kind of file is safe by default.
      - id: app
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            app:
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE*'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/CODEOWNERS'
              - '!.github/dependabot.yml'
              - '!.github/labels.yml'
              - '!.github/license-policy.json'
              - '!.github/scripts/**'
              - '!.github/workflows/dependency-review.yml'
              - '!.github/workflows/labels.yml'
              - '!.github/workflows/pr-checks.yml'
              - '!.github/workflows/selfhost-smoke.yml'

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci-static.sh

  db:
    needs: changes
    if: needs.changes.outputs.db == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start trimmed Supabase stack
        run: |
          # The stack's ports (55320-55329) sit in Linux's ephemeral range, so an outbound connection
          # (an image pull, say) can be handed one of them first and the container then fails to bind.
          sudo sysctl -qw net.ipv4.ip_local_reserved_ports=55320-55329
          pnpm exec supabase start -x studio,imgproxy,logflare,vector,storage-api,edge-runtime,supavisor,mailpit
      - name: Database checks (same script as pnpm ci:local)
        run: bash scripts/ci-db.sh

  # 3-CG14 (#339): the phase 3 compliance gate. Fails if any criterion in docs/compliance/phase3-gate.md
  # stops holding, e.g. a PR that drops the daily-cap check. Required check; see ci-ok below.
  compliance:
    needs: changes
    if: needs.changes.outputs.compliance == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start trimmed Supabase stack
        run: |
          # The stack's ports (55320-55329) sit in Linux's ephemeral range, so an outbound connection
          # (an image pull, say) can be handed one of them first and the container then fails to bind.
          sudo sysctl -qw net.ipv4.ip_local_reserved_ports=55320-55329
          pnpm exec supabase start -x studio,imgproxy,logflare,vector,storage-api,edge-runtime,supavisor,mailpit
      - name: Phase 3 compliance gate (pgTAP)
        # helpers/ is passed too: the CLI mounts only the paths it is given, and every test
        # includes ../helpers/_setup.psql (a .psql file, so pg_prove does not run it as a test).
        run: pnpm exec supabase test db supabase/tests/compliance supabase/tests/helpers
      - name: Phase 3 compliance gate (Edge Function half and gate document)
        run: pnpm exec vitest run tests/compliance

  db-upgrade:
    # Applies this PR's new migrations on top of the base branch's schema and seed data,
    # the way they will run against the pilot database.
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
      - name: Install base branch dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; fi
      - name: Base schema plus seed
        run: |
          if [ ! -d supabase/migrations ]; then
            echo "Base branch has no migrations yet; nothing to upgrade from."
            echo "SKIP_UPGRADE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          npx --yes supabase@2.122.0 start -x studio,imgproxy,logflare,vector,storage-api,edge-runtime,supavisor,mailpit
          npx --yes supabase@2.122.0 db reset
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SKIP_UPGRADE != '1'
        with:
          clean: false
      - name: Apply this PR's migrations on top
        if: env.SKIP_UPGRADE != '1'
        run: npx --yes supabase@2.122.0 migration up --local

  e2e-core:
    # The pull request's browser tests: the tests tagged @core, on desktop Chrome, in one job.
    # Skipped when the change cannot reach the app (see the `app` filter in `changes`).
    # The whole suite runs in `e2e` below once the change is on main.
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium
      # The same stack as the full run, so a core test never behaves differently here.
      - name: Start Supabase stack
        run: |
          # The stack's ports (55320-55329) sit in Linux's ephemeral range, so an outbound connection
          # (an image pull, say) can be handed one of them first and the container then fails to bind.
          sudo sysctl -qw net.ipv4.ip_local_reserved_ports=55320-55329
          pnpm exec supabase start -x studio,imgproxy,logflare,vector,edge-runtime,supavisor
      - name: Playwright (core journeys)
        run: |
          vmstat -t 1 > "$RUNNER_TEMP/vmstat.log" 2>&1 &
          pnpm test:e2e:core
      # A failed browser test often traces back to the stack (a sign-in that timed out, a slow
      # query); the Playwright report alone cannot show which service stalled. vmstat.log is the
      # runner's own load, second by second, to tell a stalled machine from a stalled service.
      - name: Keep the stack's logs
        if: failure()
        run: |
          mkdir -p test-results/stack-logs
          for c in $(docker ps -a --format '{{.Names}}' | grep '^supabase_'); do
            docker logs --timestamps "$c" > "test-results/stack-logs/$c.log" 2>&1 || true
          done
          cp "$RUNNER_TEMP/vmstat.log" test-results/stack-logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-core-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    # F10 (#20): the whole Playwright suite against the local stack. Runs on every push to main
    # (desktop Chrome and iPhone WebKit) and on the nightly schedule (every project), not on pull
    # requests: those run `e2e-core`. A failure here is a red CI run on the main branch's commit.
    # Traces and videos upload on failure; the smoke spec's happy-path videos upload on every run.
    #
    # Split into four shards. One runner needs about 45 minutes for the two push projects,
    # which the 25-minute limit cancelled on every run; each shard has its own database, so
    # they do not interfere. The limit is 40 minutes because the nightly run covers four device
    # projects, twice the push load per shard.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      # Storage and the mail catcher stay on, as in `pnpm ci:local`: the upload specs (branding,
      # signage) and the email specs (sign-in codes, report previews) need them.
      - name: Start Supabase stack
        run: |
          # The stack's ports (55320-55329) sit in Linux's ephemeral range, so an outbound connection
          # (an image pull, say) can be handed one of them first and the container then fails to bind.
          sudo sysctl -qw net.ipv4.ip_local_reserved_ports=55320-55329
          pnpm exec supabase start -x studio,imgproxy,logflare,vector,edge-runtime,supavisor
      - name: Playwright
        env:
          FULL_MATRIX: ${{ github.event_name == 'schedule' }}
          SHARD: ${{ matrix.shard }}/4
        run: |
          vmstat -t 1 > "$RUNNER_TEMP/vmstat.log" 2>&1 &
          if [ "$FULL_MATRIX" = true ]; then pnpm test:e2e --shard="$SHARD"
          else pnpm test:e2e --project=desktop-chrome --project=iphone --shard="$SHARD"; fi
      # A failed browser test often traces back to the stack (a sign-in that timed out, a slow
      # query); the Playwright report alone cannot show which service stalled. vmstat.log is the
      # runner's own load, second by second, to tell a stalled machine from a stalled service.
      - name: Keep the stack's logs
        if: failure()
        run: |
          mkdir -p test-results/stack-logs
          for c in $(docker ps -a --format '{{.Names}}' | grep '^supabase_'); do
            docker logs --timestamps "$c" > "test-results/stack-logs/$c.log" 2>&1 || true
          done
          cp "$RUNNER_TEMP/vmstat.log" test-results/stack-logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  ci-ok:
    if: always()
    # `changes` is here so that a failed paths filter fails the roll-up: the jobs that wait on
    # it would otherwise be skipped, and skipped counts as fine.
    needs: [changes, static, db, compliance, db-upgrade, e2e-core, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed or were skipped
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then exit 1; fi
          done
