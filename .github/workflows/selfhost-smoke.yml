# 2P-OPS7 (#213): boots the self-host stack from scratch and runs the smoke journey against it.
# Supabase image bumps are occasionally breaking: find out here, not at a customer
# (technical-design.md 7). Runs nightly, on release tags and on PRs that touch the stack.
# Single owner: nobody else edits this file while the ticket is open.
name: selfhost-smoke

on:
  pull_request:
    paths:
      - 'deploy/selfhost/**'
      - 'apps/web/Dockerfile'
      - 'apps/web/docker/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'tests/e2e/selfhost/**'
      - '.github/workflows/selfhost-smoke.yml'
  push:
    tags: ['v*']
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

concurrency:
  group: selfhost-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: deploy/selfhost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: .

      - name: Unit checks (bats) and compose guards
        run: pnpm --dir ../.. test:selfhost

      - name: Generate secrets
        run: ./setup.sh --non-interactive --public-url http://localhost --signup open

      - name: The stack refuses a published demo key
        run: bash tests/check-refusal.sh

      - name: Build and start the stack
        run: docker compose up -d --build --wait

      - name: Web image, routing and headers
        run: |
          bash tests/check-web-image.sh --no-build
          bash tests/check-routing.sh

      - name: Smoke journey
        working-directory: .
        run: |
          set -a; . deploy/selfhost/.env; set +a
          export SELFHOST_URL=http://localhost SELFHOST_ANON_KEY=$ANON_KEY SELFHOST_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          pnpm exec playwright test -c playwright.selfhost.config.ts

      - name: Demo mode (switch the same stack to DEMO_MODE=true)
        run: |
          pw=$(openssl rand -hex 12)
          sed -i "s/^DEMO_MODE=.*/DEMO_MODE=true/; s/^DEMO_PASSWORD=.*/DEMO_PASSWORD=$pw/" .env
          docker compose up -d --wait
          cd ../..
          set -a; . deploy/selfhost/.env; set +a
          export SELFHOST_DEMO=1 SELFHOST_DEMO_PASSWORD=$DEMO_PASSWORD SELFHOST_URL=http://localhost SELFHOST_ANON_KEY=$ANON_KEY SELFHOST_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          pnpm exec playwright test -c playwright.selfhost.config.ts

      - name: Backup, wipe and restore, then run the journey again
        run: |
          sudo apt-get install -y --no-install-recommends age
          age-keygen -o "$RUNNER_TEMP/qm-backup.key" 2>/dev/null
          echo "BACKUP_AGE_RECIPIENT=$(age-keygen -y "$RUNNER_TEMP/qm-backup.key")" >> .env
          QM_BACKUP_KEY="$RUNNER_TEMP/qm-backup.key" bash tests/check-backup.sh
          cd ../..
          set -a; . deploy/selfhost/.env; set +a
          export SELFHOST_URL=http://localhost SELFHOST_ANON_KEY=$ANON_KEY SELFHOST_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          pnpm exec playwright test -c playwright.selfhost.config.ts smoke.spec.ts -g "guest is served"

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: selfhost-smoke-${{ github.run_attempt }}
          path: |
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Open or update the selfhost-broken issue (nightly only)
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        working-directory: .
        run: |
          existing=$(gh issue list --label selfhost-broken --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing: $RUN_URL"
          else
            gh issue create --label selfhost-broken --title "selfhost-smoke is failing" \
              --body "The nightly self-host smoke run failed: $RUN_URL. Likely an image bump in deploy/selfhost/docker-compose.yml."
          fi
